<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae4a8"/>
      <stop offset="45%" stop-color="#d49419"/>
      <stop offset="100%" stop-color="#9a6008"/>
    </linearGradient>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c22"/>
      <stop offset="60%" stop-color="#0b1c14"/>
      <stop offset="100%" stop-color="#050e0a"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Circular Luxury Seal -->
  <circle cx="32" cy="32" r="30.5" fill="url(#emeraldBg)" stroke="url(#goldGrad)" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#d49419" stroke-width="0.8" stroke-dasharray="1.5 2.5" opacity="0.6"/>

  <!-- Palm Fronds Silhouettes at top sides -->
  <path d="M12 28 C16 22 22 22 24 25 C20 25 15 27 12 28 Z" fill="#2d6a4f" opacity="0.8"/>
  <path d="M52 28 C48 22 42 22 40 25 C44 25 49 27 52 28 Z" fill="#2d6a4f" opacity="0.8"/>

  <!-- Gourmet Flame Crest -->
  <path d="M32 9 C30.5 11.5 28.5 13 28.5 15 C28.5 16.8 30 18 32 18 C34 18 35.5 16.8 35.5 15 C35.5 13 33.5 11.5 32 9 Z" fill="url(#goldGrad)"/>

  <!-- Caribbean Toucan (Tucán Caribeño de Limón) Silhouette & Art -->
  <!-- Toucan Body -->
  <path d="M26 31 C26 26 30 22 35 22 C37 22 39 23 40 24.5 C39 27 38 31 38 36 C38 42 36 47 34 50 C33 50.5 32 50 31.5 49 C32.5 45 33 41 33 37 C31.5 38 29.5 38 28 37 C26.8 35.5 26 33.5 26 31 Z" fill="#0d1f17" stroke="url(#goldGrad)" stroke-width="0.8"/>
  
  <!-- Toucan Yellow/Gold Breast -->
  <path d="M28 27 C30 25 33 24 35 24 C36 26 36 29 35.5 32 C33 34 30.5 34 29 32.5 C28.2 31 28 29 28 27 Z" fill="#fbbf24"/>
  
  <!-- Iconic Toucan Beak (Gran Pico Limonense) -->
  <path d="M28 25 C23 24 16 27 15 32 C17 33.5 21 33 28 30 Z" fill="url(#beakGrad)" stroke="url(#goldGrad)" stroke-width="0.7"/>
  <path d="M15 32 C17 32.8 22 32.5 28 29.5" stroke="#ef4444" stroke-width="0.9" fill="none"/>
  
  <!-- Eye with turquoise ring -->
  <circle cx="33" cy="26" r="2.2" fill="#065f46"/>
  <circle cx="33" cy="26" r="1.2" fill="#fae4a8"/>
  <circle cx="33.2" cy="25.8" r="0.6" fill="#0d1f17"/>

  <!-- Puerto Viejo Waves Base -->
  <path d="M18 47 C22 45 26 48 30 46 C34 44 38 47 42 45 C44 44 46 45 48 46" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M22 51 C26 49 30 52 34 50 C38 48 42 51 45 50" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/>
</svg>